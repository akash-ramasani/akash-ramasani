name: Generate profile metrics

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Overview card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/overview.svg
          user: akash-ramasani
          template: classic
          base: header, activity, community, repositories
          base_indepth: yes
          config_timezone: America/Los_Angeles
          config_display: large
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_followup: yes
          plugin_followup_sections: repositories

      - name: Languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/languages.svg
          user: akash-ramasani
          template: classic
          base: ""
          config_timezone: America/Los_Angeles
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_ignored: jupyter notebook, mdx, powershell, shell, scss
          plugin_languages_details: bytes-size, percentage
          plugin_languages_colors: github

      - name: Recent activity card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/activity.svg
          user: akash-ramasani
          template: classic
          base: ""
          config_timezone: America/Los_Angeles
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 30
          plugin_activity_filter: commit, pr, issue, release, star
          plugin_activity_visibility: public

      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/isocalendar.svg
          user: akash-ramasani
          template: classic
          base: ""
          config_timezone: America/Los_Angeles
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
